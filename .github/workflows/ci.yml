name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Upload release candidate for review
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main' && github.repository == 'finance-lab-project/frontend'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 7
      - name: Record release candidate
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main' && github.repository == 'finance-lab-project/frontend'
        run: |
          printf 'Source SHA: `%s`\n\nArtifact: `github-pages` (built and verified in this run).\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main' && github.repository == 'finance-lab-project/frontend'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    # Confirm required reviewers, no admin bypass, and main-only branch protection
    # before enabling this automatic release-candidate trigger. See docs/deployment.md.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record deployed source and URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf 'Deployed source SHA: `%s`\n\nURL: %s\n' "$GITHUB_SHA" "$PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
