version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Two npm PRs plus one Actions PR cap routine updates at three.
    # Security updates have a separate GitHub-managed limit.
    open-pull-requests-limit: 2
    groups:
      # Major updates remain separate from these minor/patch groups.
      vitest:
        applies-to: version-updates
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types: ["minor", "patch"]
      react:
        applies-to: version-updates
        patterns:
          - "react"
          - "react-dom"
        update-types: ["minor", "patch"]
      vitest-security:
        applies-to: security-updates
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types: ["minor", "patch"]
      react-security:
        applies-to: security-updates
        patterns:
          - "react"
          - "react-dom"
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
